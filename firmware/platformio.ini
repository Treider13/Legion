; ============================================================================
; LEGION — ESP32 → ADF4351 RF synthesizer controller
; Multi-board firmware. One codebase, per-board pin maps in include/board_pins.h
;
; Платформа: pioarduino 55.03.311 (Arduino core 3.x / ESP-IDF 5.x) для ВСЕХ плат.
; Обоснование: официальный espressif32@7.0.1 НЕ поддерживает Arduino на
; ESP32-C6/H2 (проверено сборкой: "This board doesn't support arduino framework").
; Единая платформа = единое ядро Arduino для всех плат = нет расхождений API.
; ============================================================================

[platformio]
default_envs = esp32-s3

[common]
; pioarduino stable 55.03.311 (проверено: gh api repos/pioarduino/platform-espressif32/releases/latest)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; WebSocket-сервер (фаза 4; только WiFi-платы — на H2 не компилируется)
lib_deps = gilmaimon/ArduinoWebsockets@^0.5.4
build_flags =
    -D LEGION_VERSION=\"0.1.0\"
    -D LEGION_BUILD_BOARD=\"$PIOENV\"

; --- ESP32 classic (Xtensa LX6 x2, BT Classic+BLE, UART via USB bridge) -----
[env:esp32dev]
platform = ${common.platform}
lib_deps = ${common.lib_deps}
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -D LEGION_BOARD_CLASSIC=1

; --- ESP32-S3 (Xtensa LX7 x2, BLE5, native USB, fast GPIO) — рекомендована ---
[env:esp32-s3]
platform = ${common.platform}
lib_deps = ${common.lib_deps}
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -D LEGION_BOARD_S3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- ESP32-S2 (Xtensa LX7 x1, native USB, БЕЗ Bluetooth) --------------------
; ВАЖНО: у S2 нет периферии USB Serial/JTAG (HWCDC) — только USB OTG.
; Поэтому ARDUINO_USB_MODE=0 (TinyUSB "Native USB mode" → Serial = USBSerial).
; Проверено сборкой на core 3.3.11: с USB_MODE=1 — ошибка 'HWCDCSerial not declared'.
[env:esp32-s2]
platform = ${common.platform}
lib_deps = ${common.lib_deps}
board = esp32-s2-saola-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -D LEGION_BOARD_S2=1
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- ESP32-C3 (RISC-V x1 @160, BLE5, native USB) ----------------------------
[env:esp32-c3]
platform = ${common.platform}
lib_deps = ${common.lib_deps}
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -D LEGION_BOARD_C3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- ESP32-C6 (RISC-V x1 @160, WiFi 6, BLE 5.3, native USB) -----------------
[env:esp32-c6]
platform = ${common.platform}
lib_deps = ${common.lib_deps}
board = esp32-c6-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -D LEGION_BOARD_C6=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- ESP32-H2 (RISC-V, БЕЗ WiFi — только UART/BLE режим) --------------------
[env:esp32-h2]
platform = ${common.platform}
board = esp32-h2-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -D LEGION_BOARD_H2=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- Хостовые юнит-тесты: pio test -e native ---------------------------------
; Собирает ТОЛЬКО freq_planner.cpp (чистый C++, без Arduino) + тесты.
[env:native]
platform = native
build_flags =
    -std=c++17
    -D LEGION_HOST_TEST=1
    -D UNITY_INCLUDE_DOUBLE
build_src_filter = +<freq_planner.cpp>
test_framework = unity
test_build_src = yes
